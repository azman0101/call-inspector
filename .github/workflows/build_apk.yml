name: Build Test APK

on:
  pull_request:
    branches:
      - main
  # Build the production-branch APK only after the dependency gate passes.
  # Feature branches still run through pull_request and may publish dev APKs.
  push:
    branches:
      - main
  # "Publier maintenant": on main, publishes a release once the build passes, without the release window.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-24.04
    # Every build, main included, uses 'production' (SENTRY_DSN, NVD_API_KEY): it cannot read the signing
    # secrets, which only the publish job below gets, from the 'release' environment.
    environment: production
    env:
      # Goes into BuildConfig. Set for every Gradle step, not only the APK ones: a value that differs
      # between steps changes BuildConfig and recompiles all Kotlin.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (MIT-licensed cache; v6's default cache-provider is proprietary, see PR review)
        with:
          # Dependency-Check stores the NVD H2 database outside Gradle's
          # default caches; include it so cold runners do not redownload it.
          gradle-home-cache-includes: |
            caches
            notifications
            dependency-check-data
          # Lets setup-gradle save the configuration cache (it may hold secrets, so it is only stored
          # encrypted). Without the secret, every run configures the build from scratch.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Compute version information
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_NAME="${{ github.head_ref || github.ref_name }}"
          CLEAN_REF=$(echo "$REF_NAME" | sed 's#[^a-zA-Z0-9.-]#-#g' | cut -c1-20)

          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            VERSION_NAME="1.0.${RUN_NUM}"
            IS_RELEASE="true"
          else
            VERSION_NAME="1.0.${RUN_NUM}-${CLEAN_REF}.${SHORT_SHA}"
            IS_RELEASE="false"
          fi

          echo "VERSION_CODE=${RUN_NUM}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "IS_RELEASE=${IS_RELEASE}" >> $GITHUB_ENV
          echo "Bumping version: $VERSION_NAME (code: $RUN_NUM, is_release: $IS_RELEASE)"

      - name: Prepare build environment
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew

          # Restauration ou génération du debug.keystore requis par signingConfig 'debugConfig'
          # (alias androiddebugkey, mots de passe "android", cf. app/build.gradle.kts)
          if [ ! -f debug.keystore ]; then
            if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
              echo "Restoring debug.keystore from secrets.DEBUG_KEYSTORE_BASE64..."
              printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set: debug APK signed with a throwaway key; it cannot update a debug APK from another run."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Création du fichier .env pour le plugin secrets-gradle s'il n'existe pas
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace --profile

      # On main the scan gates the release (the publish job needs this one), so it runs here. On pull
      # requests it is advisory and runs in the dependency-check job below, in parallel with this one.
      - name: Scan dependencies (OWASP Dependency-Check)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          NVD_API_KEY_RAW: ${{ secrets.NVD_API_KEY }}
        run: |
          nvd_api_key_trimmed="$(printf '%s' "${NVD_API_KEY_RAW:-}" | tr -d '[:space:]')"
          if [ -n "${nvd_api_key_trimmed}" ]; then
            export NVD_API_KEY_RAW="${nvd_api_key_trimmed}"
          fi
          unset NVD_API_KEY
          ./gradlew dependencyCheckAnalyze --no-daemon --no-configuration-cache --stacktrace --info

      - name: Upload dependency scan report
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: app/build/reports
          if-no-files-found: ignore
          retention-days: 30

      # Construction de l'APK Debug sur les branches (PR)
      - name: Build Debug APK (Feature Branch)
        if: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.event_name != 'push') }}
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleDebug --stacktrace --profile

      - name: Upload Debug APK Artifact
        if: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.event_name != 'push') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: info-operateur-debug-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Pull requests build the debug APK, whose D8 dexing of every library took about 7 CPU-minutes per
      # run (mergeExtDexDebug waits on it). Main is the only branch whose Gradle cache is saved, and it does
      # not build that APK otherwise: building it here puts the debug dex in that cache, for every pull
      # request to reuse. The APK itself is not uploaded.
      - name: Warm the debug dexing cache (Main Branch)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: ./gradlew assembleDebug --stacktrace --profile

      # Per-task timings (Gradle --profile) of every build step above, to compare runs: the slowest tasks
      # go to the job summary and this log, the full reports to the gradle-profile artifact.
      - name: Summarize Gradle profile
        if: always()
        run: tools/gradle_profile_summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-profile
          path: build/reports/profile
          if-no-files-found: ignore
          retention-days: 14

  # Merges that land on main close together go into one release, instead of one release each. Every build
  # of main that passes waits here 30 minutes, then publishes only if no newer build of main has passed in
  # the meantime: the last build of the wave publishes, and its release notes list every pull request merged
  # since the previous release. A newer build still running is waited for, since it may fail. "Publier
  # maintenant" (workflow_dispatch on main) skips the 30 minutes. See tools/release_window.sh.
  release-window:
    name: Release window (30 min)
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    # 30 minutes of quiet, plus at most 45 for a newer build still running.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.window.outputs.publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools

      - name: Wait for the merges that follow
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
          QUIET_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '0' || '30' }}
          PENDING_MINUTES: '45'
          BUILD_JOB: Build & Test Android APK
        run: tools/release_window.sh

  # Builds the signed release APK of the commit the window chose to publish, scans it with VirusTotal,
  # publishes the GitHub release and points the README's VirusTotal badge at its report. Only this job reads
  # the signing secrets: the 'release' environment, restricted to main, holds them (KEYSTORE_BASE64,
  # STORE_PASSWORD, KEY_PASSWORD) with SENTRY_DSN (tools/setup-release-environment.sh). It is never cancelled
  # half-way: a publication waits for the one in progress.
  publish:
    name: Publish the release
    needs: release-window
    if: ${{ needs.release-window.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    # contents: write to commit the badge link on main and to create the tag and the GitHub release.
    permissions:
      contents: write
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Same version as the build job of this run: the run number is the versionCode, so it always grows.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Restore the Gradle User Home that the build job saves on main (dependencies, compiled classes).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (MIT-licensed cache; v6's default cache-provider is proprietary, see PR review)
        with:
          # The same entries as the build job, whose cache this restores; the build job alone saves it.
          gradle-home-cache-includes: |
            caches
            notifications
            dependency-check-data
          cache-read-only: true

      - name: Prepare build environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Restoring my-upload-key.jks from secrets.KEYSTORE_BASE64..."
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > my-upload-key.jks
          else
            # Alias must match keyAlias "upload" in app/build.gradle.kts. publish_release.sh refuses the APK.
            echo "::warning::KEYSTORE_BASE64 secret is not set: signing with a throwaway key. This APK cannot update an install signed by any other build."
            keytool -genkeypair -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CI Ephemeral Upload Key,O=call-inspector,C=FR"
          fi
          # Fichier .env pour le plugin secrets-gradle
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: my-upload-key.jks
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: info-operateur-release-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Informational VirusTotal scan of the release APK: detections produce a warning and the report link in
      # the job summary, never a failure (continue-on-error, and the script itself only warns). Needs the
      # VIRUSTOTAL_API_KEY secret, else it is skipped.
      - name: Scan APK with VirusTotal (non-blocking)
        id: virustotal
        continue-on-error: true
        timeout-minutes: 15
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: tools/virustotal_scan.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"

      # Tag v<version> on the built commit, the signed APK and its SHA-256 as assets, and notes listing the
      # checksums, signing certificate, VirusTotal report, this run, and the pull requests merged since the
      # previous release, sorted into Nouveautés, Correctifs and Autres changements. The script refuses an APK
      # that is not signed with the release key (a missing KEYSTORE_BASE64 secret makes the build fall back to
      # a throwaway key): such an APK could not update any install. Tags made with GITHUB_TOKEN start no
      # workflow run.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Release signing certificate, as published in the README ("Vérifier la signature").
          EXPECTED_CERT_SHA256: 1f45c660f2385aee7bdd9aa05eaa562d8b4caf7fcfcb32c386a2f2fdd8ed793a
          ARTIFACT_NAME: info-operateur-release-v${{ env.VERSION_NAME }}
          VIRUSTOTAL_REPORT_URL: ${{ steps.virustotal.outputs.report_url }}
          VIRUSTOTAL_MALICIOUS: ${{ steps.virustotal.outputs.malicious }}
          VIRUSTOTAL_SUSPICIOUS: ${{ steps.virustotal.outputs.suspicious }}
        run: tools/publish_release.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"

      # The badge in the README links to shields.io, which links to VirusTotal — but the report URL is keyed
      # by the APK's own SHA-256, so it changes on every release and can't be hard-coded. This step points the
      # badge's link straight at the report just produced, and commits that one line on main. Main may have
      # moved since the built commit (the window lasts 30 minutes), so the edit is made on its current head.
      # [skip ci], and pushes made with GITHUB_TOKEN start no workflow run anyway, so this can't loop.
      - name: Point the VirusTotal badge at the latest report
        if: ${{ steps.virustotal.outputs.report_url != '' }}
        continue-on-error: true
        env:
          REPORT_URL: ${{ steps.virustotal.outputs.report_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout --detach --force FETCH_HEAD
            python3 - <<'EOF'
          import os
          import re

          report_url = os.environ["REPORT_URL"]
          path = "README.md"
          content = open(path, encoding="utf-8").read()
          new_content, count = re.subn(
              r'(\[!\[VirusTotal\]\([^)]*\)\])\([^)]*\)',
              lambda m: f"{m.group(1)}({report_url})",
              content,
              count=1,
          )
          if count == 0:
              raise SystemExit("VirusTotal badge link not found in README.md")
          if new_content != content:
              open(path, "w", encoding="utf-8").write(new_content)
              print("README.md updated with the current VirusTotal report link")
          else:
              print("README.md already links to the current report")
          EOF
            if git diff --quiet -- README.md; then
              exit 0
            fi
            git commit -m "docs: point the VirusTotal badge at the latest release APK report [skip ci]" -- README.md
            # Rejected if main moved since the fetch: start again from its new head.
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  # Pull requests only: the advisory dependency scan runs next to the build instead of before the APK.
  dependency-check:
    name: Dependency scan (OWASP)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      # Restore the Gradle User Home saved by the build job on main (dependencies, NVD database).
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2 (MIT-licensed cache; v6's default cache-provider is proprietary, see PR review)
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            dependency-check-data

      - name: Prepare build environment
        run: |
          chmod +x gradlew
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          fi

      - name: Scan dependencies (OWASP Dependency-Check)
        env:
          NVD_API_KEY_RAW: ${{ secrets.NVD_API_KEY }}
        # A scan finding is advisory on pull requests; on main it gates the release APK (build job).
        continue-on-error: true
        run: |
          nvd_api_key_trimmed="$(printf '%s' "${NVD_API_KEY_RAW:-}" | tr -d '[:space:]')"
          if [ -n "${nvd_api_key_trimmed}" ]; then
            export NVD_API_KEY_RAW="${nvd_api_key_trimmed}"
          fi
          unset NVD_API_KEY
          ./gradlew dependencyCheckAnalyze --no-configuration-cache --stacktrace --info

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: app/build/reports
          if-no-files-found: ignore
          retention-days: 30
