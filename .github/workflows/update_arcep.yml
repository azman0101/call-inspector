name: Update ARCEP Database

on:
  schedule:
    # Run on the 1st and 15th of every month at 04:00 UTC
    - cron: '0 4 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-db:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Download & compile ARCEP database
        run: |
          python3 tools/update_arcep_db.py --output app/src/main/assets/arcep_data.db

      - name: Commit & push if database changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/arcep_data.db
          if git diff --staged --quiet; then
            echo "Aucune modification de la base ARCEP."
          else
            git commit -m "chore(data): mise à jour de la base ARCEP (MAJNUM et identifiants_CE)"
            git push
          fi
